<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Category List</title>
<style>
  :root{
    --paper:#E9EBEE; --surface:#FFFFFF; --ink:#0E1116; --muted:#6B7480;
    --rule:#D8DCE1; --accent:#1F4FD8; --accent-soft:#E7ECFC;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:28px 20px 64px}

  .top{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding-bottom:14px;
       border-bottom:2px solid var(--ink)}
  h1{margin:0;flex:1 1 auto;font-size:19px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
  .brand{flex:none;display:block;height:20px;width:auto}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
  .tool{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:6px;
                    padding:6px 12px;cursor:pointer;background:none;color:var(--muted)}
  .tools{margin-left:auto;display:flex;gap:6px}
  .tool{background:var(--surface);border:1px solid var(--rule);color:var(--ink)}
  .tool:hover{border-color:var(--ink)}
  .count{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .search{flex:1 1 260px;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--surface);
          border:1.5px solid var(--rule);border-radius:8px;padding:0 6px 0 11px}
  .search:focus-within{border-color:var(--ink)}
  .search svg{flex:none;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
  .search input{flex:1 1 auto;min-width:0;border:0;outline:0;background:none;font:inherit;padding:8px 0;color:var(--ink)}
  .search button{flex:none;border:0;background:none;cursor:pointer;font-size:18px;line-height:1;
                 color:var(--muted);padding:4px 6px;visibility:hidden}
  .search.has button{visibility:visible}
  .branch.hide,.kid.hide{display:none}
  mark{background:#D8ED5C;color:inherit;border-radius:2px;padding:0 1px}
  .empty{display:none;padding:22px;text-align:center;color:var(--muted)}
  .empty.on{display:block}
  .kid .nm{cursor:copy}
  .kid .nm:hover{text-decoration:underline}

  .list{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
  .branch{border-bottom:1px solid var(--rule)}
  .branch:last-child{border-bottom:0}

  .head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;
        background:none;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .head:hover{background:#F5F7F9}
  .head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .caret{flex:none;width:9px;height:9px;border-right:1.8px solid var(--muted);
         border-bottom:1.8px solid var(--muted);transform:rotate(-45deg);margin-left:2px;
         transition:transform .16s ease}
  .open .caret{transform:rotate(45deg)}
  .chip{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:3px 7px;
        border-radius:5px;background:var(--accent-soft);color:var(--accent);cursor:copy;
        border:1px solid transparent}
  .chip:hover{border-color:var(--accent)}
  .title{flex:1 1 auto;font-weight:600;letter-spacing:-.005em}

  .kids{display:none;padding:12px 14px 14px 44px;background:#FBFCFD;
        border-top:1px solid var(--rule)}
  .open .kids{display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:1px 20px}
  .kid{display:flex;align-items:baseline;gap:9px;padding:5px 0;border-bottom:1px dotted #E3E7EB}
  .kid .chip{font-size:10.5px;padding:2px 6px;background:#EEF0F3;color:#4A5360}
  .kid .chip:hover{border-color:var(--ink)}
  .kid span{min-width:0;overflow-wrap:anywhere}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;
         pointer-events:none;background:var(--ink);color:#fff;font-family:var(--mono);
         font-size:12px;padding:9px 14px;border-radius:7px;transition:.18s ease;z-index:9}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:560px){.kids{padding-left:18px}.tools{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Ad Category List</h1>
    <img class="brand" src="jamx-logo.png" alt="JamX">
  </div>
  <div class="bar">
    <label class="search" id="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search categories" autocomplete="off" aria-label="Search categories">
      <button type="button" id="qclear" aria-label="Clear search">&times;</button>
    </label>
    <div class="tools">
      <button class="tool" id="expand">Expand all</button>
      <button class="tool" id="collapse">Collapse all</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">No categories match that search.</div>
</div>
<div id="toast"></div>

const list = document.getElementById('list');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1400);
}
function copy(text){
  const done = () => toast(text + ' copied');
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch(e){ toast('Copy blocked. Select the text manually'); }
  ta.remove();
}

// Rows with an IAB id get a chip that copies it; rows without one copy the name on click.
function render(){
  list.innerHTML = DATA.map(b => `
  <div class="branch">
    <button class="head" aria-expanded="false">
      <i class="caret"></i>
      ${b.id ? `<span class="chip" data-copy="${b.id}" title="Copy ${b.id}">${b.id}</span>` : ''}
      <span class="title" data-name="${esc(b.name)}">${esc(b.name)}</span>
      ${b.id ? '' : `<span class="count">${b.kids.length}</span>`}
    </button>
    ${b.kids.length ? `<div class="kids"><div class="grid">${b.kids.map(k => `
      <div class="kid">
        ${k.id ? `<span class="chip" data-copy="${k.id}" title="Copy ${k.id}">${k.id}</span>
        <span data-name="${esc(k.name)}">${esc(k.name)}</span>` : `<span class="nm" data-copy="${esc(k.name)}" data-name="${esc(k.name)}" title="Copy name">${esc(k.name)}</span>`}
      </div>`).join('')}</div></div>` : ''}
  </div>`).join('');
  filter();
}
// Keyword search: a matching group shows all its subcategories; otherwise only the matching ones show.
const q = document.getElementById('q');
function mark(el, term){
  const name = el.dataset.name;
  if (!term){ el.textContent = name; return; }
  const i = name.toLowerCase().indexOf(term);
  el.innerHTML = i < 0 ? esc(name)
    : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + term.length)) + '</mark>' + esc(name.slice(i + term.length));
}
function filter(){
  const term = q.value.trim().toLowerCase();
  document.getElementById('search').classList.toggle('has', !!q.value);
  let shown = 0;
  list.querySelectorAll('.branch').forEach(br => {
    const title = br.querySelector('.title');
    const id = (br.querySelector('.head .chip') || {}).dataset?.copy || '';
    mark(title, term);
    const groupHit = !term || title.dataset.name.toLowerCase().includes(term) || id.toLowerCase() === term;
    let kidHits = 0;
    br.querySelectorAll('.kid').forEach(k => {
      const nm = k.querySelector('[data-name]');
      const kid = (k.querySelector('.chip') || {}).dataset?.copy || '';
      mark(nm, term);
      const hit = !term || groupHit || nm.dataset.name.toLowerCase().includes(term) || kid.toLowerCase() === term;
      k.classList.toggle('hide', !hit);
      if (term && hit) kidHits++;
    });
    const show = groupHit || kidHits > 0;
    br.classList.toggle('hide', !show);
    if (show) shown++;
    if (term && br.querySelector('.kids')){
      br.classList.toggle('open', show);
      br.querySelector('.head').setAttribute('aria-expanded', show);
    }
  });
  document.getElementById('empty').classList.toggle('on', shown === 0);
}
q.addEventListener('input', () => {
  if (!q.value.trim()) setAll(false);
  filter();
});
document.getElementById('qclear').onclick = () => { q.value = ''; setAll(false); filter(); q.focus(); };
function setAll(on){
  list.querySelectorAll('.branch').forEach(br => {
    if (!br.querySelector('.kids') || br.classList.contains('hide')) return;
    br.classList.toggle('open', on);
    br.querySelector('.head').setAttribute('aria-expanded', on);
  });
}
document.getElementById('expand').onclick = () => setAll(true);
document.getElementById('collapse').onclick = () => setAll(false);
render();

list.addEventListener('click', e => {
  const chip = e.target.closest('[data-copy]');
  if (chip){ e.stopPropagation(); copy(chip.dataset.copy); return; }
  const head = e.target.closest('.head');
  if (!head) return;
  const br = head.closest('.branch');
  if (!br.querySelector('.kids')) return;
  const on = !br.classList.contains('open');
  br.classList.toggle('open', on);
  head.setAttribute('aria-expanded', on);
});
